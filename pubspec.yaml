name: likelion_mid_hackathon
description: "근막 이완 코스 앱 - 맞춤 셀프케어 루틴"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase & Auth (Google 로그인용)
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.2

  # ML Kit Pose Detection (자세 측정)
  google_mlkit_pose_detection: ^0.12.0

  # Camera
  camera: ^0.11.1

  # Local Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # State Management
  provider: ^6.1.2

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.5
  permission_handler: ^11.3.1

  # TTS (자세 측정 음성 안내)
  flutter_tts: ^4.2.0

  # 코스 생성 (팀원 추가)
  http: ^1.2.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/tools/
    - assets/images/body/
    - assets/images/moves/
